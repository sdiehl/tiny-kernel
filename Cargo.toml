[package]
name = "tiny-kernel"
version = "0.1.0"
authors = ["Stephen Diehl <stephen.m.diehl@gmail.com>"]
categories = ["algorithms"]
edition = "2021"
keywords = ["typechecker"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/sdiehl/tiny-kernel"
description = "A dependent type theory kernel"

[dependencies]
lalrpop-util = { version = "0.23.1", features = ["lexer", "unicode"] }
logos = "0.16"
thiserror = "2.0"

[build-dependencies]
lalrpop = { version = "0.23.1", features = ["lexer", "unicode"] }

[dev-dependencies]
insta = { version = "1.41", features = ["glob"] }

[[example]]
name = "run_all"
path = "examples/run_all.rs"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
